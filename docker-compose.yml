version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bot_db
      POSTGRES_USER: bot_user
      POSTGRES_PASSWORD: bot_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"   # для миграции/отладки через psql; уберите в проде
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot_user -d bot_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  bot:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: dev
    volumes:
      - ./config/config.dev.yml:/app/config.dev.yml
      - ./logs:/app/logs

volumes:
  pgdata: