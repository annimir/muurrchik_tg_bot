services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bot_db
      POSTGRES_USER: bot_user
      POSTGRES_PASSWORD: bot_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot_user -d bot_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  bot:
    build: .
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    extra_hosts:
      - "www.youtube.com:142.251.156.4"
      - "youtube.com:142.251.156.4"
      - "m.youtube.com:142.251.156.4"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: dev
    volumes:
      - ./config/config.dev.yml:/app/config.dev.yml
      - ./logs:/app/logs
      - media_data:/app/data/media

  web:
    build: .
    command: ["uvicorn", "web.app:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: dev
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./config/config.dev.yml:/app/config.dev.yml
      - media_data:/app/data/media

volumes:
  pgdata:
  media_data: