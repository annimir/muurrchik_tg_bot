version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bot_db
      POSTGRES_USER: bot_user
      POSTGRES_PASSWORD: bot_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"  # можно убрать в проде, оставить только для локальной отладки
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot_user -d bot_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  bot:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: prod
    volumes:
      - ./config.prod.yml:/app/config.prod.yml
      - ./logs:/app/logs

volumes:
  pgdata: