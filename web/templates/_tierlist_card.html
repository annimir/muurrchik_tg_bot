{% macro character_card(character, editor=false) %}
<article class="tier-character"{% if editor %} data-character-id="{{ character.id }}" data-game="{{ character.game }}" data-region="{{ character.region.id }}" data-element="{{ character.element.id }}" data-gender="{{ character.gender.id }}" data-rarity="{{ character.rarity }}" data-name="{{ character.name|lower }}" draggable="true" tabindex="0" role="button" aria-label="Выбрать {{ character.name }}"{% endif %}>
    <img src="{{ character.image }}" alt="" loading="lazy" width="96" height="96">
    <strong>{{ character.name }}</strong>
    <small>{{ character.element.name }} · {{ character.region.name }}</small>
    <span class="tier-character-rarity">{{ character.rarity }}★</span>
</article>
{% endmacro %}
