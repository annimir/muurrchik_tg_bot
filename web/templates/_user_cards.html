{% for user in users %}
<a class="profile-card" href="/users/{{ user.id }}">
    <span class="profile-initial">{{ (user.tag or '?')[0]|upper }}<img src="/media/users/{{ user.id }}/avatar" alt="" loading="lazy" data-avatar-image></span>
    <span class="profile-content"><strong>{{ user.tag or 'Путешественник' }}</strong></span>
    <span class="profile-facts">
        <span>Персонажи: {% if user.character_name %}{{ user.character_name }}{% else %}{{ user.character_count }}{% endif %}</span>
        <span>Подписки: {{ user.subscription_count }}</span>
    </span>
</a>
{% endfor %}
